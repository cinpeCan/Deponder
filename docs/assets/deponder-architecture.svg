<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Deponder Architecture: 5 Non-Intrusive Operators, Dual-Plane UDF, and One-Shot Topological Unfolding">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F8FD"/>
      <stop offset="100%" stop-color="#EDF2FB"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3949AB"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#3949AB"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#059669"/>
    </marker>
    <marker id="dimTick" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <line x1="4" y1="0" x2="4" y2="8" stroke="#0891B2" stroke-width="1.6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .panel-title { font-size: 13px; font-weight: 700; fill: #1E293B; }
    .panel-sub { font-size: 10px; font-weight: 500; fill: #64748B; }
    .chip-text { font-size: 10.5px; font-weight: 600; fill: #1E293B; }
    .badge-text { font-size: 9.5px; font-weight: 700; }
    .small-note { font-size: 9.5px; font-weight: 500; }
  </style>

  <!-- Outer Canvas (Light card surface ensures crisp rendering on GitHub Light & Dark themes) -->
  <rect x="2" y="2" width="956" height="356" rx="18" fill="url(#bgGrad)" stroke="#D6DFEE" stroke-width="1.5"/>

  <!-- ==================== LEFT PANEL: 5 NON-INTRUSIVE OPERATORS ==================== -->
  <rect x="18" y="18" width="468" height="324" rx="14" fill="#FFFFFF" stroke="#DCE3F2" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="34" y="42" class="panel-title">Non-Intrusive Spatial Model (5 Symmetric Operators)</text>
  <text x="34" y="58" class="panel-sub">Zero wrapper layouts — layer-only RenderNode / GraphicsLayer transforms</text>

  <!-- deponderRoot container box -->
  <rect x="34" y="72" width="436" height="252" rx="12" fill="#F8FAFF" stroke="#93A5CF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="44" y="80" width="214" height="22" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="54" y="95" class="mono badge-text" fill="#3949AB">deponderRoot (Coordinate Space)</text>

  <!-- Wall repulsion cushion arrows -->
  <line x1="40" y1="205" x2="62" y2="205" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <line x1="464" y1="205" x2="442" y2="205" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="42" y="222" class="small-note" fill="#64748B">wallRepulsionDp</text>

  <!-- Repulsion halo around Left Planet (:core) -->
  <circle cx="132" cy="186" r="56" fill="#4F46E5" fill-opacity="0.06" stroke="#4F46E5" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="132" y="254" text-anchor="middle" class="small-note" fill="#4F46E5">repulsionRadiusDp</text>

  <!-- Repulsion halo + Drag touchSlop ring around Right Planet (:compose) -->
  <circle cx="372" cy="186" r="56" fill="#7C3AED" fill-opacity="0.06" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="372" cy="186" r="39" fill="none" stroke="#E11D48" stroke-opacity="0.5" stroke-width="1.1" stroke-dasharray="2 2"/>

  <!-- Left Planet UI Card (:core) -->
  <rect x="86" y="164" width="92" height="44" rx="12" fill="#FFFFFF" stroke="#3949AB" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="101" cy="186" r="4.5" fill="#4F46E5"/>
  <text x="112" y="190" class="mono chip-text">:core</text>
  <rect x="80" y="138" width="104" height="19" rx="9.5" fill="#3949AB"/>
  <text x="132" y="151" text-anchor="middle" class="mono badge-text" fill="#FFFFFF">deponderPlanet</text>

  <!-- Right Planet UI Card (:compose) -->
  <rect x="320" y="164" width="104" height="44" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="335" cy="186" r="4.5" fill="#7C3AED"/>
  <text x="346" y="190" class="mono chip-text">:compose</text>
  <rect x="320" y="138" width="104" height="19" rx="9.5" fill="#7C3AED"/>
  <text x="372" y="151" text-anchor="middle" class="mono badge-text" fill="#FFFFFF">deponderPlanet</text>
  <rect x="321" y="216" width="102" height="19" rx="9.5" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1"/>
  <text x="372" y="229" text-anchor="middle" class="mono badge-text" fill="#BE123C">deponderDrag</text>
  <text x="372" y="248" text-anchor="middle" class="small-note" fill="#BE123C">touchSlop click-safe</text>

  <!-- Endpoint Safe-Area (DeponderRubberInsets) annotations -->
  <rect x="178" y="176" width="14" height="20" rx="3" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="306" y="176" width="14" height="20" rx="3" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Rubber + Stretch connector line & label -->
  <line x1="194" y1="186" x2="304" y2="186" stroke="#475569" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <rect x="219" y="176" width="60" height="20" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="249" y="189.5" text-anchor="middle" class="mono badge-text" fill="#1E293B">api link</text>

  <!-- Rubber callout & orthogonal braces -->
  <line x1="249" y1="176" x2="249" y2="146" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="186" y="114" width="126" height="30" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="249" y="127" text-anchor="middle" class="mono badge-text" fill="#0F172A">deponderRubber</text>
  <text x="249" y="139" text-anchor="middle" class="mono badge-text" fill="#475569">+ deponderStretch</text>

  <!-- Dimension lines at bottom explaining RubberPhysics (center-to-center) vs DeponderRubberInsets (contour + gap) -->
  <line x1="132" y1="208" x2="132" y2="242" stroke="#0891B2" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="132" y1="258" x2="132" y2="278" stroke="#0891B2" stroke-opacity="0.65" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="372" y1="252" x2="372" y2="278" stroke="#0891B2" stroke-opacity="0.65" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="132" y1="274" x2="372" y2="274" stroke="#0891B2" stroke-width="1.3" marker-start="url(#dimTick)" marker-end="url(#dimTick)"/>
  <text x="252" y="290" text-anchor="middle" class="mono badge-text" fill="#0E7490">RubberPhysics — Center-to-Center Rest Span</text>
  <text x="252" y="306" text-anchor="middle" class="small-note" fill="#0891B2">DeponderRubberInsets — Layer-Only Contour + Gap Clearance</text>

  <!-- ==================== RIGHT PANEL: DUAL-PLANE UDF & UNFOLD PIPELINE ==================== -->
  <rect x="502" y="18" width="440" height="324" rx="14" fill="#FFFFFF" stroke="#DCE3F2" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="520" y="42" class="panel-title">Dual-Plane UDF &amp; One-Shot unfold() Lifecycle</text>
  <text x="520" y="58" class="panel-sub">One-shot layout guidance hands off to Newtonian physics &amp; idle sleep</text>

  <!-- Control Plane Card -->
  <rect x="520" y="72" width="196" height="74" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="530" y="90" class="badge-text" fill="#3730A3">CONTROL PLANE (loopGateFlow)</text>
  <text x="530" y="106" class="small-note" fill="#312E81">attached &amp;&amp; started &amp;&amp; hasBodies</text>
  <text x="530" y="120" class="small-note" fill="#312E81">&amp;&amp; energyAwake (distinctUntilChanged)</text>
  <text x="530" y="136" class="mono badge-text" fill="#4F46E5">Choreographer / withFrameNanos</text>

  <!-- Data Plane Card -->
  <rect x="728" y="72" width="196" height="74" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="738" y="90" class="badge-text" fill="#0F172A">DATA PLANE (Reducers)</text>
  <text x="738" y="106" class="small-note" fill="#475569">• Fast-path 120Hz drag / moveTo</text>
  <text x="738" y="120" class="small-note" fill="#475569">• state.unfold() / controller.unfold()</text>
  <text x="738" y="136" class="mono badge-text" fill="#475569">Layer-only pose projection</text>

  <!-- Flow arrows down into unfold() / SimulationWorld -->
  <line x1="618" y1="146" x2="618" y2="168" stroke="#3949AB" stroke-width="1.6" marker-end="url(#arrowIndigo)"/>
  <line x1="826" y1="146" x2="826" y2="168" stroke="#475569" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- Stage 1: Transient One-Shot unfold() Box -->
  <rect x="520" y="172" width="404" height="58" rx="10" fill="url(#indigoGrad)"/>
  <text x="534" y="191" class="badge-text" fill="#E0E7FF">1. ONE-SHOT TRANSIENT GUIDE (state.unfold() / controller.unfold())</text>
  <text x="534" y="207" class="small-note" fill="#FFFFFF">Untangles cycles, trees &amp; islands while respecting pinned nodes</text>
  <text x="534" y="221" class="mono badge-text" fill="#C7D2FE">Pre-layout pending latch · fades out over 0.85s (alphaUnfold → 0)</text>

  <!-- Arrow down to Stage 2 -->
  <line x1="722" y1="230" x2="722" y2="248" stroke="#3949AB" stroke-width="1.6" marker-end="url(#arrowIndigo)"/>

  <!-- Stage 2: Pure Newtonian Springs + 3-Tier Execution -->
  <rect x="520" y="252" width="242" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="532" y="270" class="badge-text" fill="#0F172A">2. PURE NEWTONIAN PHYSICS</text>
  <text x="532" y="286" class="small-note" fill="#475569">1/120s sub-stepping · Hooke + Repulsion</text>
  <text x="532" y="300" class="small-note" fill="#475569">airDamping (0f = perpetual) · Quadtree</text>
  <text x="532" y="314" class="small-note" fill="#475569">Parallel Snapshot Evaluation (Dispatchers.Default)</text>

  <!-- Arrow right to Stage 3 -->
  <line x1="762" y1="288" x2="782" y2="288" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowEmerald)"/>

  <!-- Stage 3: Idle Sleep -->
  <rect x="786" y="252" width="138" height="72" rx="10" fill="url(#emeraldGrad)"/>
  <circle cx="801" cy="271" r="4" fill="#A7F3D0"/>
  <text x="810" y="275" class="badge-text" fill="#FFFFFF">3. IDLE SLEEP</text>
  <text x="798" y="294" class="mono badge-text" fill="#ECFDF5">Loop Suspended</text>
  <text x="798" y="310" class="small-note" fill="#D1FAE5">Dual |v| &amp; |a| gate</text>
</svg>
