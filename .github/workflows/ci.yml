name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run KMP Core & Compose Unit Tests + ABI Checks
        run: ./gradlew :deponder-core:jvmTest :deponder-compose:desktopTest :deponder-compose:testAndroidHostTest :deponder-core:checkKotlinAbi :deponder-compose:checkKotlinAbi

      - name: Run Android Unit Tests, Lint & ABI Check
        run: ./gradlew :deponder:testDebugUnitTest :deponder:lintRelease :deponder:apiCheck

      - name: Verify Publication Metadata & Dokka Javadoc Jars
        run: ./gradlew publishToMavenLocal
