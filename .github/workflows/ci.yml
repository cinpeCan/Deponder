name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run KMP Core & Compose Unit Tests + ABI Checks
        run: ./gradlew :deponder-core:jvmTest :deponder-compose:desktopTest :deponder-compose:testAndroidHostTest :deponder-core:checkKotlinAbi :deponder-compose:checkKotlinAbi

      - name: Run Android Unit Tests, Lint & ABI Check
        run: ./gradlew :deponder:testDebugUnitTest :deponder:lintRelease :deponder:apiCheck

      - name: Verify Publication Metadata & Dokka Javadoc Jars
        run: ./gradlew publishToMavenLocal

  verify-apple-spm:
    name: Build & Test Apple Swift Package
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Swift Export XCFramework & Generated SPM Sources
        run: ./gradlew :deponder-core:assembleDeponderAppleSwiftPackage

      - name: Run Native Swift Package Tests
        env:
          DEPONDER_LOCAL_BINARY: '1'
        run: swift test

      - name: Build Deponder SwiftUI Package for iOS Simulator
        env:
          DEPONDER_LOCAL_BINARY: '1'
        run: xcodebuild -scheme Deponder -destination "generic/platform=iOS Simulator" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build

      - name: Build Deponder SwiftUI Package for macOS
        env:
          DEPONDER_LOCAL_BINARY: '1'
        run: xcodebuild -scheme Deponder -destination "platform=macOS,arch=arm64" build
