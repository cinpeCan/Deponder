name: Publish to Maven Central

on:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish All Multiplatform Artifacts to Central Portal
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Release Tag Matches Project Version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION="$(grep -E 'val deponderVersion\s*=' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Release tag version: $TAG_VERSION, build.gradle.kts version: $BUILD_VERSION"
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "Mismatch between release tag ($TAG_VERSION) and deponderVersion ($BUILD_VERSION)" >&2
            exit 1
          fi

      - name: Run Tests & ABI Verification
        run: ./gradlew :deponder-core:jvmTest :deponder-core:checkKotlinAbi :deponder-compose:desktopTest :deponder-compose:checkKotlinAbi :deponder:testDebugUnitTest :deponder:apiCheck

      - name: Publish and Release to Maven Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
